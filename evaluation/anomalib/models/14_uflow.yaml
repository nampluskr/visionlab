# evaluation/anomalib/models/14_uflow.yaml: uflow model

model:
  class_path: anomalib.models.Uflow
  init_args:
    # anomalib default is "mcait"; resnet18 has a local weights file.
    backbone: resnet18
    flow_steps: 4
    affine_clamp: 2.0
    affine_subnet_channels_ratio: 1.0
    permute_soft: false
    visualizer: false
    # anomalib's default pre-processor fixes the input size at 448x448.
    # This phase uses 256x256 to match the visionlab Dataset input size.
    pre_processor:
      class_path: anomalib.pre_processing.PreProcessor
      init_args:
        transform:
          class_path: torchvision.transforms.v2.Compose
          init_args:
            transforms:
              - class_path: torchvision.transforms.v2.Resize
                init_args:
                  size: [256, 256]
                  antialias: true
              - class_path: torchvision.transforms.v2.Normalize
                init_args:
                  mean: [0.485, 0.456, 0.406]
                  std: [0.229, 0.224, 0.225]
