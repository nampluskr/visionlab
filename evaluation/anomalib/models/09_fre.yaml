# evaluation/anomalib/models/09_fre.yaml: fre model

# The original pins max_epochs=220; LocalFre overrides it with the shared 10 epochs (user decision).
model:
  class_path: local_models.LocalFre
  init_args:
    backbone: resnet50
    layer: layer3
    pre_trained: true
    pooling_kernel_size: 2
    input_dim: 65536
    latent_dim: 220
    visualizer: false
