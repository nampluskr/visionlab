# evaluation/anomalib/models/02_efficient_ad.yaml: efficient_ad model and budget

model:
  class_path: local_models.LocalEfficientAd
  init_args:
    # teacher_file must match model_size.
    model_size: small
    teacher_file: D:/backbones/efficientad_pretrained_weights/pretrained_teacher_small.pth
    imagenet_dir: D:/datasets/imagenette2/train
    teacher_out_channels: 384
    lr: 0.0001
    weight_decay: 0.00001
    padding: false
    pad_maps: true
    visualizer: false

# EfficientAd requires train batch size 1. Pass --config data/<name>.yaml before this file.
data:
  init_args:
    train_batch_size: 1
    eval_batch_size: 16

trainer:
  max_epochs: 20
