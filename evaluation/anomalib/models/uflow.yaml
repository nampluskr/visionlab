# evaluation/anomalib/models/uflow.yaml: uflow model

model:
  class_path: anomalib.models.Uflow
  init_args:
    # anomalib default is "mcait"; resnet18 has a local weights file.
    backbone: resnet18
    flow_steps: 4
    affine_clamp: 2.0
    affine_subnet_channels_ratio: 1.0
    permute_soft: false
    visualizer: false
