# evaluation/anomalib/models/06_patchcore.yaml: patchcore model and budget

model:
  class_path: anomalib.models.Patchcore
  init_args:
    backbone: wide_resnet50_2
    layers: [layer2, layer3]
    pre_trained: true
    coreset_sampling_ratio: 0.1
    num_neighbors: 9
    visualizer: false

# anomalib pins max_epochs=1 for this model; the pinned value overrides the trainer value.
trainer:
  max_epochs: 1
