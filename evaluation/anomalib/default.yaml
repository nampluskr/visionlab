# evaluation/anomalib/default.yaml: default seed, output root and trainer settings (anomalib CLI config format)

# Models requiring multiple training epochs use exactly 10 epochs.
# Their model YAML files must not override this shared training budget.
# Exceptions decided by the user before a Phase for training time (CFLOW: 1 epoch)
# set the epoch count through trainer.max_epochs in the model YAML.
# Models whose trainer_arguments pin max_epochs (dfkde, dfm, padim, patchcore, winclip: 1,
# fre: 220) ignore this value in anomalib_run.py.
seed_everything: 42
default_root_dir: D:/projects/visionlab/outputs/anomalib

trainer:
  max_epochs: 10
  devices: 1
  # "warn": deterministic where available; cumsum_cuda_kernel (metrics) has no
  # deterministic implementation and only warns.
  deterministic: warn
  # anomalib's Engine uses no logger by default; true makes Lightning log into each run folder.
  logger: true
