# src/visionlab/anomaly_detection/configs/models/uflow.yaml: native UFlow with a local backbone
# Pass --data <name> before --model uflow.
model:
  class_path: visionlab.anomaly_detection.models.uflow.lightning_model.UflowLitModel
  init_args:
    # anomalib default is "mcait", which has no local weights; same as the reference YAML.
    backbone: resnet18
    flow_steps: 4
    affine_clamp: 2.0
    affine_subnet_channels_ratio: 1.0
    permute_soft: false
    visualizer: false

trainer:
  num_sanity_val_steps: 0
