# src/visionlab/anomaly_detection/configs/data/mvtec.yaml: local MVTec reference-equivalent split settings
data:
  class_path: visionlab.anomaly_detection.data.mvtec.lightning_data.MVTecLitData
  init_args:
    root: D:/datasets/mvtec
    category: bottle
    train_batch_size: 8
    eval_batch_size: 8
    num_workers: 0
    val_split_mode: from_test
    val_split_ratio: 0.4
    seed: 42
